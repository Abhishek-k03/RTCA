spring:
  application:
    name: rtca
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rtca}
    username: ${DB_USER:rtca}
    password: ${DB_PASSWORD:rtca}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: rtca-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

app:
  jwt:
    # base64, 256 bits min. override in prod
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1mb3ItcnRjYS1jaGFuZ2UtbWUtaW4tcHJvZA==}
    access-token-ttl: ${JWT_TTL:15m}
    issuer: rtca
  auth:
    refresh:
      ttl: ${REFRESH_TTL:30d}
      reuse-interval: 30s
      # needs https, browsers make an exception for localhost
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  ws:
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}
  relay:
    enabled: ${RELAY_ENABLED:true}
  files:
    dir: ${FILES_DIR:./data/files}
    max-image-size: 10MB
    max-avatar-size: 2MB
  messages:
    edit-window: ${MSG_EDIT_WINDOW:15m}
    delete-window: ${MSG_DELETE_WINDOW:15m}
  rate-limit:
    messages:
      limit: ${MSG_RATE_LIMIT:20}
      window: ${MSG_RATE_WINDOW:10s}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
