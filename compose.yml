services:
  postgres:
    image: postgres:16-alpine
    container_name: rtca-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtca}
      POSTGRES_USER: ${POSTGRES_USER:-rtca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtca}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rtca-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  redis-data:
